# Optional engine settings. Every value below is the BUILT-IN DEFAULT; uncomment a line to change it.
# Rules are explained in docs/algorithms.md. Amplitude values are synthetic units, not magnitudes.

# --- Threshold detection (synthetic amplitude) ---
#detection.minorThreshold=0.30
#detection.moderateThreshold=0.50
#detection.highThreshold=0.75

# --- Moving-average noise filter ---
#filter.windowSize=3
#filter.maxGapSeconds=5

# --- Multi-sensor correlation ---
#correlation.windowSeconds=5
#correlation.maxEventDurationSeconds=40
#correlation.radiusKm=40
#correlation.minSensors=3
#correlation.frequencyToleranceHz=4
#correlation.minSignalDurationSeconds=0.5
#correlation.waveSpeedKmPerSecond=6

# --- Confidence (weights must add up to 1.0) ---
#confidence.agreementWeight=0.30
#confidence.temporalWeight=0.25
#confidence.spatialWeight=0.20
#confidence.signalWeight=0.25
#confidence.confirmationThreshold=60

# --- Sensor reliability and fault rules (score 0..100) ---
#reliability.validStreakForBonus=10
#reliability.validStreakBonus=1
#reliability.invalidPenalty=4
#reliability.outlierPenalty=8
#reliability.unverifiedOutlierPenalty=3
#reliability.communicationPenalty=10
#reliability.invalidWindowSize=10
#reliability.repeatedInvalidCount=3
#reliability.repeatedOutlierCount=3
#reliability.outlierMemorySeconds=120
#reliability.peerDisagreementRatio=3
#reliability.faultyBelowScore=40
#reliability.recoveryValidStreak=20
#reliability.suddenDropPoints=20
#reliability.suddenDropWindowSeconds=60

# --- Communication monitoring ---
#communication.timeoutSeconds=5
#communication.recoveryReadings=3

# --- Severity escalation ---
#severity.criticalAmplitude=1.0
#severity.criticalMinSensors=6
#severity.criticalMinDurationSeconds=5
#severity.criticalMinConfidence=75
#severity.widespreadMinSensors=6
#severity.widespreadRadiusKm=20

# --- Live simulator ---
#simulation.randomSeed=20261013
#simulation.sampleIntervalMillis=1000
#simulation.threadPoolSize=4
#simulation.minorEventSeconds=8
#simulation.minorEventPeakAmplitude=0.44
#simulation.majorEventSeconds=12
#simulation.majorEventPeakAmplitude=1.15
#simulation.faultSeconds=25
#simulation.communicationFailureSeconds=15
#simulation.noisySeconds=20
#simulation.invalidDataSeconds=12
#simulation.attenuationLengthKm=40
#simulation.waveSpeedKmPerSecond=6
